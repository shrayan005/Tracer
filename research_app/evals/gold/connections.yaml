how_to: 'Each group = claims from different papers that answer the SAME question. Remove members that don''t belong,
  add missed claims (ids like P3.C2), fix stances (supports, opposes, no effect), merge or split groups. Then set
  `reviewed: true` for the case.'
cases:
- case: creatine
  brief: Investigate how creatine supplementation influences muscle strength outcomes in older adult populations,
    including mechanisms, dosage protocols, and comparative effectiveness.
  reviewed: true
  papers:
  - key: 2738
    label: (Chilibeck et al., 2017)
    study_type: meta_analysis
    n: 721
    sex: mixed
    duration: 3 months or more
    claims:
    - id: P1.C1
      factor: creatine supplementation vs placebo during resistance training
      outcome: lean tissue mass
      direction: increase
      population: older adults
      magnitude: mean difference =1.37 kg [95% CI =0.97–1.76]; p <0.00001
    - id: P1.C2
      factor: creatine supplementation vs placebo during resistance training
      outcome: chest press strength
      direction: increase
      population: older adults
      magnitude: SMD =0.35 [0.16–0.53]; p =0.0002
    - id: P1.C3
      factor: creatine supplementation vs placebo during resistance training
      outcome: leg press strength
      direction: increase
      population: older adults
      magnitude: SMD =0.24 [0.05–0.43]; p =0.01
  - key: 2742
    label: (Yao et al., 2026)
    study_type: meta_analysis
    n: 11
    sex: mixed
    duration: not reported
    claims:
    - id: P2.C1
      factor: creatine supplementation combined with resistance training vs resistance training alone
      outcome: muscle strength
      direction: increase
      population: older adults aged 60 years and older
      magnitude: g = 0.31, 95% CI 0.18 to 0.45
    - id: P2.C2
      factor: creatine supplementation combined with resistance training vs resistance training alone
      outcome: muscle mass
      direction: no difference
      population: older adults aged 60 years and older
      magnitude: g = 0.35, 95% CI −0.09 to 0.78
    - id: P2.C3
      factor: creatine supplementation combined with resistance training vs resistance training alone
      outcome: physical function
      direction: no difference
      population: older adults aged 60 years and older
      magnitude: g = 0.47, 95% CI −0.08 to 1.03; p = 0.086
  - key: 2739
    label: (Amiri & Sheikholeslami‐Vatani, 2023)
    study_type: randomized_trial
    n: 45
    sex: mixed
    duration: under 3 months
    claims:
    - id: P3.C1
      factor: resistance training (before vs after)
      outcome: malondialdehyde (MDA)
      direction: decrease
      population: older adults
      magnitude: p = 0.001
    - id: P3.C2
      factor: resistance training (before vs after)
      outcome: 8-hydroxydeoxyguanosine (8-OHdG)
      direction: decrease
      population: older adults
      magnitude: p = 0.001
    - id: P3.C3
      factor: resistance training with creatine vs resistance training with placebo (after)
      outcome: glutathione peroxidase (GPX)
      direction: increase
      population: older adults
      magnitude: p = 0.004
    - id: P3.C4
      factor: resistance training (before vs after)
      outcome: quality of life
      direction: increase
      population: older adults
      magnitude: p = 0.001
  - key: 2745
    label: (Brose et al., 2003)
    study_type: randomized_trial
    n: 28
    sex: mixed
    duration: 3 months or more
    claims:
    - id: P4.C1
      factor: creatine monohydrate vs placebo (following strength training)
      outcome: fat-free mass and total body mass
      direction: increase
      population: older adults
      magnitude: p <.05
    - id: P4.C2
      factor: creatine monohydrate vs placebo (following strength training)
      outcome: isometric knee extension strength
      direction: increase
      population: older men and women
      magnitude: p <.05
    - id: P4.C3
      factor: creatine monohydrate vs placebo (following strength training)
      outcome: isometric dorsiflexion strength
      direction: increase
      population: older men
      magnitude: p <.05
    - id: P4.C4
      factor: creatine monohydrate vs placebo (following strength training)
      outcome: intramuscular total creatine
      direction: increase
      population: older adults
      magnitude: p <.05
  - key: 2785
    label: (Stares & Bains, 2019)
    study_type: systematic_review
    n: null
    sex: mixed
    duration: 3 months or more
    claims:
    - id: P5.C1
      factor: creatine supplementation combined with resistance training vs exercise alone (before vs after / duration)
      outcome: upper and/or lower body strength, functional capacity, and lean mass
      direction: increase
      population: older adults
      magnitude: null
  - key: 2746
    label: (Devries & Phillips, 2014)
    study_type: meta_analysis
    n: 357
    sex: not reported
    duration: under 3 months
    claims:
    - id: P6.C1
      factor: Creatine + resistance training vs resistance training alone
      outcome: total body mass
      direction: increase
      population: 357 older adults
      magnitude: P = 0.004
    - id: P6.C2
      factor: Creatine + resistance training vs resistance training alone
      outcome: fat-free mass
      direction: increase
      population: 357 older adults
      magnitude: P < 0.0001
    - id: P6.C3
      factor: Creatine + resistance training vs resistance training alone
      outcome: chest press one-repetition maximum
      direction: increase
      population: 357 older adults
      magnitude: P = 0.004
    - id: P6.C4
      factor: Creatine + resistance training vs resistance training alone
      outcome: 30-s chair stand test
      direction: increase
      population: 357 older adults
      magnitude: P = 0.03
  - key: 2737
    label: (Candow et al., 2025)
    study_type: narrative_review
    n: null
    sex: not reported
    duration: not reported
    claims:
    - id: P7.C1
      factor: creatine monohydrate supplementation combined with exercise training vs none
      outcome: whole-body lean body mass, regional muscle size, muscle strength, bone area and thickness, functional
        ability, glucose kinetics, cognition and memory
      direction: increase
      population: older adults
      magnitude: null
  - key: 2740
    label: (Ramos-Hernández et al., 2025)
    study_type: randomized_trial
    n: 30
    sex: mixed
    duration: under 3 months
    claims:
    - id: P8.C1
      factor: CRE + HMB vs placebo (before vs after)
      outcome: leg strength
      direction: increase
      population: 30 physically active older adults
      magnitude: p < 0.05
    - id: P8.C2
      factor: CRE + HMB vs placebo (before vs after)
      outcome: fat mass
      direction: decrease
      population: 30 physically active older adults
      magnitude: p < 0.05
  - key: 2741
    label: (Michalak et al., 2026)
    study_type: narrative_review
    n: null
    sex: not applicable
    duration: not applicable
    claims:
    - id: P9.C1
      factor: creatine supplementation combined with progressive resistance training vs resistance training alone
      outcome: lean mass
      direction: increase
      population: older adults
      magnitude: null
    - id: P9.C2
      factor: creatine supplementation combined with progressive resistance training vs resistance training alone
      outcome: dynamic strength
      direction: increase
      population: older adults
      magnitude: null
    - id: P9.C3
      factor: creatine supplementation combined with progressive resistance training vs resistance training alone
      outcome: functional performance
      direction: increase
      population: older adults
      magnitude: null
    - id: P9.C4
      factor: creatine supplementation (stand‑alone) vs no supplementation
      outcome: areal bone mineral density
      direction: no difference
      population: older adults
      magnitude: null
    - id: P9.C5
      factor: creatine supplementation vs baseline
      outcome: muscle total creatine and PCr availability
      direction: increase
      population: older adults
      magnitude: null
  - key: 2816
    label: (Bodrick & Zakariya, 2025)
    study_type: randomized_trial
    n: null
    sex: male
    duration: not applicable
    claims:
    - id: P10.C1
      factor: creatine and whey protein supplementation with resistance training vs resistance training alone
      outcome: muscular hypertrophy, exercise endurance, and recovery
      direction: increase
      population: older males aged 50 to 75
      magnitude: null
    - id: P10.C2
      factor: post-exercise supplementation vs pre-exercise supplementation
      outcome: muscular hypertrophy
      direction: increase
      population: older males aged 50 to 75
      magnitude: null
    - id: P10.C3
      factor: creatine and whey protein supplementation vs no supplementation
      outcome: anxiety
      direction: decrease
      population: older males aged 50 to 75
      magnitude: null
    - id: P10.C4
      factor: recommended dosage supplementation vs higher/unsafe dosage
      outcome: adverse safety events
      direction: no difference
      population: older males aged 50 to 75
      magnitude: null
  groups:
  - question: Does creatine (with resistance training) increase muscle strength in older adults?
    members:
    - claim: P1.C2
      stance: supports
    - claim: P1.C3
      stance: supports
    - claim: P2.C1
      stance: supports
    - claim: P4.C2
      stance: supports
    - claim: P4.C3
      stance: supports
    - claim: P6.C3
      stance: supports
    - claim: P9.C2
      stance: supports
  - question: Does creatine (with resistance training) increase lean / fat-free mass in older adults?
