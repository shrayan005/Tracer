- case: triceps
  brief: Investigate the mechanical behavior, force generation, and functional role of the triceps brachii during
    elbow extension, including measurement techniques and existing reviews.
  reviewed: true
  papers:
  - key: 35
    label: (Hussain et al., 2020)
    study_type: lab_experiment
    n: 25
    sex: male
    duration: under 3 months
    claims:
    - id: P1.C1
      factor: exercise intensity (30% vs 60% 1RM)
      outcome: rate of fatigue
      direction: increase
      population: twenty-five healthy, untrained, active, male university students
      magnitude: P < 0.05
    - id: P1.C2
      factor: exercise intensity (30% vs 60% 1RM)
      outcome: endurance time
      direction: decrease
      population: twenty-five healthy, untrained, active, male university students
      magnitude: null
  - key: 1924
    label: (Roberts et al., 2026)
    study_type: randomized_trial
    n: 10
    sex: female
    duration: under 3 months
    claims:
    - id: P2.C1
      factor: training (before vs after)
      outcome: peak torque
      direction: increase
      population: 10 untrained women
      magnitude: p = 0.040
    - id: P2.C2
      factor: training (before vs after) in forearm flexion
      outcome: electromyographic co-activation
      direction: decrease
      population: 10 untrained women
      magnitude: p = 0.011, -7.78%
    - id: P2.C3
      factor: training (before vs after)
      outcome: muscle thickness
      direction: no difference
      population: 10 untrained women
      magnitude: p = 0.106
  - key: 19
    label: (Akima et al., 2021)
    study_type: lab_experiment
    n: 17
    sex: mixed
    duration: single session
    claims:
    - id: P3.C1
      factor: 120° vs 60° elbow angle
      outcome: RMS during force levels of 60% and 80% MVC
      direction: decrease
      population: 7 men and 10 women
      magnitude: P = 0.001 to P = 0.004
    - id: P3.C2
      factor: between joint angles (60°, 90°, 120°)
      outcome: sum of difference in RMS from the identical line
      direction: no difference
      population: 7 men and 10 women
      magnitude: P = 0.741
  - key: 16
    label: (Kholinne et al., 2018)
    study_type: lab_experiment
    n: 10
    sex: mixed
    duration: single session
    claims:
    - id: P4.C1
      factor: long head vs lateral and medial heads at 0° shoulder elevation
      outcome: muscle force and muscle activation
      direction: increase
      population: ten healthy participants
      magnitude: p < 0.05
    - id: P4.C2
      factor: medial head vs long and lateral heads at 90°, 135° and 180° shoulder elevation
      outcome: muscle force
      direction: increase
      population: ten healthy participants
      magnitude: p < 0.05
  - key: 18
    label: (Peterson et al., 2017)
    study_type: lab_experiment
    n: 11
    sex: mixed
    duration: 3 months or more
    claims:
    - id: P5.C1
      factor: biceps vs deltoid transfer
      outcome: voluntary activation
      direction: increase
      population: nine individuals with SCI who had undergone either biceps or deltoid transfer
      magnitude: p = .03
    - id: P5.C2
      factor: biceps vs deltoid transfer
      outcome: maximum voluntary moments
      direction: increase
      population: nine individuals with SCI who had undergone either biceps or deltoid transfer
      magnitude: p < .001
  - key: 137
    label: (Mansour et al., 2025)
    study_type: computational
    n: 14
    sex: female
    duration: single session
    claims:
    - id: P6.C1
      factor: LSTM vs other machine learning models (RF, CNN, DT, DNN, SVM, LR)
      outcome: correlation coefficient R for predicting elbow joint moments and triceps force
      direction: increase
      population: 14 female participants
      magnitude: R = 0.98374
  - key: 1852
    label: (Stasinaki et al., 2018)
    study_type: lab_experiment
    n: 9
    sex: female
    duration: under 3 months
    claims:
    - id: P7.C1
      factor: short vs long fascicle length training (before vs after)
      outcome: elbow extension 1-RM
      direction: increase
      population: nine novice female participants
      magnitude: 40.1 ± 21.3% for S and 44.5 ± 20.1% for L, p < 0.01
    - id: P7.C2
      factor: short vs long fascicle length training (before vs after)
      outcome: muscle thickness at 50% length
      direction: increase
      population: nine novice female participants
      magnitude: 10.7 ± 15.3% for S and 13.7 ± 9.0% for L
  - key: 1829
    label: (Werner et al., 1993)
    study_type: lab_experiment
    n: 7
    sex: not reported
    duration: single session
    claims:
    - id: P8.C1
      factor: Elbow extension before ball release (before vs after)
      outcome: biceps and triceps activity
      direction: decrease
      population: Seven healthy, adult pitchers
      magnitude: null
  - key: 67
    label: (Popadić-Gaćeša et al., 2013)
    study_type: lab_experiment
    n: 19
    sex: not reported
    duration: 3 months or more
    claims:
    - id: P9.C1
      factor: resistance training (before vs after)
      outcome: endurance strength
      direction: increase
      population: nineteen healthy young nonathletes
      magnitude: 57%, P < .001
    - id: P9.C2
      factor: resistance training (before vs after)
      outcome: fatigue rate
      direction: decrease
      population: nineteen healthy young nonathletes
      magnitude: 68%, P < .001
    - id: P9.C3
      factor: resistance training (before vs after)
      outcome: decrease in strength
      direction: increase
      population: nineteen healthy young nonathletes
      magnitude: 59%, P < .001
  - key: 1859
    label: (Günzkofer et al., 2011)
    study_type: lab_experiment
    n: 17
    sex: mixed
    duration: single session
    claims:
    - id: P10.C1
      factor: shoulder flexion (increasing vs decreasing)
      outcome: elbow flexion joint torques
      direction: decrease
      population: young and old males and females
      magnitude: not reported
  groups:
  - question: Does resistance training increase elbow-extension strength?
    members:
    - claim: P2.C1
      stance: supports
    - claim: P7.C1
      stance: supports
    - claim: P9.C1
      stance: supports
  - question: Does resistance training increase triceps muscle thickness?
    members:
    - claim: P2.C3
      stance: no effect
    - claim: P7.C2
      stance: supports
  ai_draft:
  - question: Does training increase muscle thickness?
    members:
    - claim: P2.C3
      stance: no effect
    - claim: P7.C2
      stance: supports
  labeled_by: claude
  label_note: 'Fatigue claims (P1.C1 intensity, P9.C2 training) answer different questions: not grouped.'
