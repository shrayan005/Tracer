- id: triceps-137-1
  case: triceps
  paper: (Mansour et al., 2025)
  claim: 'correlation coefficient R for predicting elbow joint moments and triceps force INCREASED (R = 0.98374)
    — factor: LSTM vs other machine learning models (RF, CNN, DT, DNN, SVM, LR) — in: 14 female participants'
  quote: The analytical outcomes demonstrated that the LSTM model yielded the highest predictive accuracy, achieving
    a correlation coefficient of R = 0.98374 when six input features [...] were used.
  section: abstract
  paragraph: 'Introduction: Understanding the biomechanics of the upper limb is of considerable interest in both
    clinical and engineering domains. Estimating elbow joint moments and triceps force plays a pivotal role in modelling
    musculoskeletal function. However, the use of electromyography (EMG) data is often constrained by challenges
    such as signal noise and calibration complexity. The objective of this study is to determine the elbow joint
    moment and triceps force during a Rest Pause Triceps Dumbbell Kickback exercise. Methods: This investigation
    utilized kinematic assessments from a cohort of 14 participants with diverse anthropometric profiles. A range
    of machine learning and deep learning models were employed to predict joint torque and triceps muscle force,
    including deep neural networks (DNN), long short-term memory networks (LSTM), convolutional neural networks
    (CNN), decision trees (DT), linear regression (LR), support vector machines (SVM), and random forests (RF).
    Model performance was systematically evaluated using multiple statistical metrics: Mean Squared Residuals (MSR),
    Root Mean Squared Error (RMSE), Mean Absolute Error (MAE), and the Correlation Coefficient (R). Results: The
    analytical outcomes demonstrated that the LSTM model yielded the highest predictive accuracy, achieving a correlation
    coefficient of R = 0.98374 when six input features (time, mass, forearm mass, upper arm mass, elbow angle, and
    height) were used. In descending order of R values, the performance of the remaining models was as follows:
    RF (0.92793), CNN (0.92106), DT (0.88812), DNN (0.75769), SVM (0.70011), and LR (0.44690). These findings underscore
    the potential of LSTM in capturing the temporal dynamics essential for biomechanical prediction. Conclusion:
    The findings from this study provide new insights into data-driven biomechanics and suggest that LSTM-based
    models may offer a promising alternative to EMG-based approaches. Accurate prediction of joint moments has significant
    implications for the real-time control of assistive technologies, particularly active orthoses in the future.'
  judge: partly
  judge_reason: Population details differ from claim
  claim_data:
    outcome: correlation coefficient R for predicting elbow joint moments and triceps force
    factor: LSTM vs other machine learning models (RF, CNN, DT, DNN, SVM, LR)
