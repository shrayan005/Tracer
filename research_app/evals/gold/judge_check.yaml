  section: abstract
  paragraph: The electromyographic (EMG) activity and force relationship, i.e. EMG-force relationship, is a valuable
    indicator of the degree of the neuromuscular activation during isometric force production. However, there is
    minimal information available regarding the EMG-force relationship of individual triceps brachii (TB) muscles
    at different elbow joint angles. This study aimed to compare the EMG-force relationships of the medial (TB-Med),
    lateral (TB-Lat), and long heads (TB-Long) of the TB. 7 men and 10 women performed force matching isometric
    tasks at 20%, 40%, 60%, and 80%maximum voluntary contraction (MVC) at 60°, 90°, and 120° of extension. During
    the submaximal force matching tasks, the surface EMG signals of the TB-Med, TB-Lat, and TB-Long were recorded
    and calculated the root mean square (RMS). RMS of each force level were then normalized by RMS at 100%MVC. For
    the TB-Med, ultrasonography was used to determine the superficial region of the muscle that faced the skin surface
    to minimize cross-talk. The joint angle was monitored using an electrogoniometer. The elbow extension force,
    elbow joint angle, and surface EMG signals were simultaneously sampled at 2 kHz and stored on a personal computer.
    The RMS did not significantly differ between the three muscles, except between the TB-Med and TB-Lat during
    20%MVC at 60°. The RMS during force levels of ≥ 60%MVC at 120° was significantly lower than that at 60° or 90°
    for each muscle. The sum of difference, which represents the difference in RMS from the identical line, did
    not significantly differ in any of the assessed muscles in the present study. This suggests that a relatively
    smaller neuromuscular activation could be required when the elbow joint angle was extended. However, neuromuscular
    activation levels and relative force levels were matched in all three TB synergists when the elbow joint angle
    was at 90° or a more flexed position.
