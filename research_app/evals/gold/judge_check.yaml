  section: abstract
  paragraph: The objective of this study was to investigate the effects of changes in exercise intensity and speed
    on the three heads of the triceps brachii (TB) during triceps push-down exercise until task failure. Twenty-five
    subjects performed triceps push-down exercise at three different intensities (30%, 45% and 60% 1RM) and speeds
    (slow, medium and fast) until failure, and surface electromyography (sEMG) signals were recorded from the lateral,
    long and medial heads of the TB. The endurance time (ET), number of repetitions (NR) and rate of fatigue (ROF)
    were analyzed. Subsequently, the root-mean-square (RMS), mean power frequency (MPF) and median frequency (MDF)
    under no-fatigue (NF) and fatigue (Fa) conditions were statistically compared. The findings reveal that ROF
    increases with increase in the intensity and speed, and the opposite were obtained for the ET. The ROF in the
    three heads were comparable for all intensities and speeds. The ROF showed a significant difference (P<0.05)
    among the three intensities and speeds for all heads. The three heads showed significantly different (P<0.05)
    MPF and MDF values with all the performed exercises under both conditions, whereas the RMS values were significantly
    different only under Fa conditions. The current observations suggest that exercise intensity and speed affect
    the ROF while changes in intensity do not affect the MPF and MDF under Fa conditions. The behavior of the spectral
    parameters indicate that the three heads do not work in unison under any of the conditions. Changes in the speed
    of triceps push-down exercise affects the lateral and long heads, but changes in the exercise intensity affected
    the attributes of all heads to a greater extent.
