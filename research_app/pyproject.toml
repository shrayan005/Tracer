[project]
name = "research-app"
version = "0.1.0"
description = "Research paper assistant: find, summarise and connect academic papers."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs the real Postgres and Redis running in WSL",
    "live: calls real LLM APIs (costs tokens); run with -m live",
]
addopts = "-m 'not live'"
